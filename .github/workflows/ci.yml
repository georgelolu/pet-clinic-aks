name: Pet Clinic CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  html-check:
    name: Validate Pet Clinic HTML
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check required website content
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class PetClinicParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.title_parts = []
                  self.in_title = False
                  self.ids = set()
                  self.headings = []
                  self.in_h3 = False
                  self.current_heading = []
                  self.links = []
                  self.text_parts = []

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if "id" in attrs:
                      self.ids.add(attrs["id"])
                  if tag == "title":
                      self.in_title = True
                  if tag == "h3":
                      self.in_h3 = True
                      self.current_heading = []
                  if tag == "a":
                      self.links.append(attrs.get("href", ""))

              def handle_endtag(self, tag):
                  if tag == "title":
                      self.in_title = False
                  if tag == "h3" and self.in_h3:
                      self.headings.append("".join(self.current_heading).strip())
                      self.in_h3 = False

              def handle_data(self, data):
                  text = data.strip()
                  if text:
                      self.text_parts.append(text)
                  if self.in_title:
                      self.title_parts.append(data)
                  if self.in_h3:
                      self.current_heading.append(data)

          path = Path("website/index.html")
          source = path.read_text(encoding="utf-8")
          parser = PetClinicParser()
          parser.feed(source)
          parser.close()

          title = "".join(parser.title_parts).strip()
          page_text = " ".join(parser.text_parts)

          assert title == "Pet Clinic | Care for Every Paw", (
              f"Unexpected page title: {title!r}"
          )
          assert {"home", "services", "contact"} <= parser.ids, (
              "Required home, services, or contact section is missing"
          )
          assert {"Health Checkups", "Vaccinations", "Pet Wellness"} <= set(
              parser.headings
          ), f"Missing service card heading: {parser.headings}"
          assert "#services" in parser.links and "#contact" in parser.links, (
              "Expected services or contact navigation link is missing"
          )
          assert "deployment-verification" in parser.ids, (
              "Deployment verification marker is missing"
          )
          assert "Healthy pets." in page_text, (
              "Expected Pet Clinic introduction is missing"
          )
          assert 'name="viewport"' in source, (
              "Responsive viewport metadata is missing"
          )

          print("HTML checks passed: title, sections, services, links, and marker.")
          PY

  kubernetes-check:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Parse and check Kubernetes manifests
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          manifest_dir = Path("website/k8s")
          files = [
              "deployment.yaml",
              "service.yaml",
              "backend-service.yaml",
              "tls-proxy.yaml",
          ]

          resources = []
          for filename in files:
              path = manifest_dir / filename
              documents = list(yaml.safe_load_all(path.read_text(encoding="utf-8")))
              documents = [doc for doc in documents if doc is not None]
              assert documents, f"No YAML resources found in {path}"

              for resource in documents:
                  assert isinstance(resource, dict), (
                      f"Invalid Kubernetes resource in {path}"
                  )
                  assert resource.get("apiVersion"), (
                      f"Missing apiVersion in {path}"
                  )
                  assert resource.get("kind"), f"Missing kind in {path}"
                  assert resource.get("metadata", {}).get("name"), (
                      f"Missing metadata.name in {path}"
                  )
                  resources.append(resource)

              print(f"YAML syntax passed: {path}")

          by_name = {
              (resource["kind"], resource["metadata"]["name"]): resource
              for resource in resources
          }

          public_service = by_name[("Service", "pet-clinic")]
          assert public_service["spec"]["type"] == "LoadBalancer"
          assert public_service["spec"]["loadBalancerIP"] == "57.167.3.11"
          assert public_service["spec"]["selector"]["app"] == "pet-clinic-proxy"
          public_ports = {
              port["port"] for port in public_service["spec"]["ports"]
          }
          assert {80, 443} <= public_ports, (
              "Public Service must expose HTTP 80 and HTTPS 443"
          )

          backend = by_name[("Service", "pet-clinic-backend")]
          assert backend["spec"]["type"] == "ClusterIP"

          proxy = by_name[("Deployment", "pet-clinic-proxy")]
          container = proxy["spec"]["template"]["spec"]["containers"][0]
          assert {80, 443} <= {
              port["containerPort"] for port in container["ports"]
          }, "Proxy container must expose ports 80 and 443"

          secret_names = {
              volume.get("secret", {}).get("secretName")
              for volume in proxy["spec"]["template"]["spec"].get("volumes", [])
          }
          assert "pet-clinic-tls" in secret_names, (
              "Proxy must mount the pet-clinic-tls Secret"
          )

          print("Kubernetes checks passed: resources, routing, TLS, and ports.")
          PY

  docker-build:
    name: Build Pet Clinic Docker Image
    runs-on: ubuntu-latest
    needs:
      - html-check
      - kubernetes-check

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./website
          file: ./website/Dockerfile
          tags: pet-clinic:ci-test
          push: false
