name: Pet Clinic CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: pet-clinic-production-deployment
  cancel-in-progress: false

env:
  ACR_NAME: petclinicacr3595
  ACR_LOGIN_SERVER: petclinicacr3595.azurecr.io
  RESOURCE_GROUP: pet-clinic-aks-rg
  AKS_CLUSTER: pet-clinic-aks
  IMAGE_NAME: pet-clinic

jobs:
  deploy:
    name: Build, Push, and Deploy to AKS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sign in to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name "$ACR_NAME"

      - name: Build and push image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker build \
            --file ./website/Dockerfile \
            --tag "$ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG" \
            ./website
          docker push "$ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG"

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group "$RESOURCE_GROUP" \
            --name "$AKS_CLUSTER" \
            --admin \
            --overwrite-existing

      - name: Deploy image to AKS
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          kubectl set image deployment/pet-clinic \
            pet-clinic="$ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG"
          kubectl rollout status deployment/pet-clinic --timeout=180s

      - name: Verify application service
        run: |
          kubectl get deployment pet-clinic
          kubectl get pods -l app=pet-clinic
          kubectl get service
