apiVersion: v1
kind: Service
metadata:
  name: pet-clinic
spec:
  type: LoadBalancer
  loadBalancerIP: 57.167.3.11
  selector:
    app: pet-clinic-proxy
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
    - name: https
      port: 443
      targetPort: 443
      protocol: TCP
